<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Wayfeather app icon - soft naturalist / watercolour variant. Avian matcha palette. -->
  <defs>
    <radialGradient id="fGround" cx="50%" cy="38%" r="82%">
      <stop offset="0" stop-color="#FBF7EB"/>
      <stop offset="0.55" stop-color="#F5EDDC"/>
      <stop offset="1" stop-color="#ECE0C5"/>
    </radialGradient>
    <radialGradient id="fBloomG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8CA35F" stop-opacity="0.3"/>
      <stop offset="0.58" stop-color="#8CA35F" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8CA35F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fBloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A07B58" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#A07B58" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#A07B58" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7A6749" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#7A6749" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7A6749" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="fCase">
      <rect x="180" y="588" width="664" height="256" rx="34"/>
    </clipPath>
    <clipPath id="fBody">
      <path d="M616 268C610 236 596 214 570 216C544 218 516 238 504 266C486 300 460 306 436 324C416 348 402 372 402 406C402 436 406 456 420 468C442 486 468 490 490 486C520 480 546 470 562 452C582 430 594 414 598 394C604 366 610 344 612 322C614 302 616 286 616 268Z"/>
    </clipPath>
    <clipPath id="fTail">
      <path d="M416 378C378 326 344 286 324 242L264 290C292 340 338 398 404 446Z"/>
    </clipPath>
    <clipPath id="fWing">
      <path d="M524 340C484 352 446 384 420 442C452 438 488 416 512 386C524 370 528 354 524 340Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#fGround)"/>
  <!-- composition scaled up for icon presence; margins stay >=10% -->
  <g transform="translate(-61.4,-76) scale(1.12)">

  <!-- washes that soaked into the paper -->
  <ellipse cx="452" cy="322" rx="322" ry="264" fill="url(#fBloomG)"/>
  <ellipse cx="524" cy="726" rx="416" ry="214" fill="url(#fBloomB)"/>
  <ellipse cx="516" cy="868" rx="322" ry="46" fill="url(#fShadow)"/>

  <!-- ============ SUITCASE ============ -->
  <!-- colour laid down slightly wide of the drawing -->
  <rect x="196" y="602" width="664" height="256" rx="34" fill="#7A5A41" opacity="0.16"/>

  <path d="M180 676H844V810A34 34 0 0 1 810 844H214A34 34 0 0 1 180 810Z" fill="#6B4F3A" opacity="0.92"/>
  <path d="M180 676V622A34 34 0 0 1 214 588H810A34 34 0 0 1 844 622V676Z" fill="#A47D58" opacity="0.9"/>

  <g clip-path="url(#fCase)">
    <!-- second and third passes -->
    <path d="M180 782H844V860H180Z" fill="#4A3423" opacity="0.28"/>
    <path d="M180 588H258V860H180Z" fill="#4A3423" opacity="0.2"/>
    <path d="M766 588H844V860H766Z" fill="#4A3423" opacity="0.2"/>
    <path d="M180 588H844V622H180Z" fill="#FBF7EB" opacity="0.18"/>
    <!-- pigment gathering at the wet edge -->
    <rect x="180" y="588" width="664" height="256" rx="34" fill="none" stroke="#463020" stroke-width="30" opacity="0.26"/>
  </g>

  <!-- leather corners -->
  <g fill="#4A3423" opacity="0.72">
    <path d="M180 694V622A34 34 0 0 1 214 588H288Z"/>
    <path d="M844 694V622A34 34 0 0 0 810 588H736Z"/>
    <path d="M180 738V810A34 34 0 0 0 214 844H288Z"/>
    <path d="M844 738V810A34 34 0 0 1 810 844H736Z"/>
  </g>

  <!-- seam -->
  <path d="M188 676H836" fill="none" stroke="#3D2C1D" stroke-width="9" opacity="0.6" stroke-linecap="round"/>

  <!-- feet -->
  <g fill="#4A3423" opacity="0.9">
    <rect x="290" y="840" width="64" height="24" rx="11"/>
    <rect x="670" y="840" width="64" height="24" rx="11"/>
  </g>

  <!-- straps -->
  <g fill="#4A3423" opacity="0.88">
    <rect x="298" y="588" width="50" height="256"/>
    <rect x="676" y="588" width="50" height="256"/>
  </g>

  <!-- brass hardware -->
  <g fill="#C09256" opacity="0.95">
    <rect x="288" y="708" width="70" height="50" rx="9"/>
    <rect x="666" y="708" width="70" height="50" rx="9"/>
    <rect x="426" y="654" width="54" height="46" rx="8"/>
    <rect x="544" y="654" width="54" height="46" rx="8"/>
  </g>
  <g fill="none" stroke="#3D2C1D" stroke-width="8" opacity="0.55" stroke-linecap="round">
    <path d="M302 733H344M680 733H722M440 677H466M558 677H584"/>
  </g>

  <!-- one quiet travel label -->
  <g transform="rotate(-7 430 788)" opacity="0.9">
    <ellipse cx="430" cy="788" rx="44" ry="33" fill="#EFE4C9"/>
    <ellipse cx="430" cy="788" rx="24" ry="16" fill="none" stroke="#7C8F52" stroke-width="8"/>
  </g>

  <!-- broken contour line -->
  <g fill="none" stroke="#4E3A26" stroke-width="8" opacity="0.6" stroke-linecap="round">
    <rect x="182" y="590" width="660" height="252" rx="34" stroke-dasharray="300 26 210 20 380 18 150"/>
  </g>

  <!-- ============ HANDLE ============ -->
  <path d="M424 590C424 516 458 494 512 494C566 494 600 516 600 590L568 590C568 528 546 522 512 522C478 522 456 528 456 590Z" fill="#6B4F3A" opacity="0.92"/>
  <path d="M424 590C424 516 458 494 512 494C566 494 600 516 600 590L568 590C568 528 546 522 512 522C478 522 456 528 456 590Z" fill="none" stroke="#4E3A26" stroke-width="9" opacity="0.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="210 18 140 16 120"/>
  <g fill="#C09256" opacity="0.95">
    <rect x="410" y="576" width="58" height="26" rx="7"/>
    <rect x="556" y="576" width="58" height="26" rx="7"/>
  </g>

  <!-- ============ BIRD ============ -->
  <g transform="translate(-51,-71.4) scale(1.1)">

    <!-- colour laid down slightly wide of the drawing -->
    <g opacity="0.17" fill="#4B6630">
      <path d="M630 286C624 254 610 232 584 234C558 236 530 256 518 284C500 318 474 324 450 342C430 366 416 390 416 424C416 454 420 474 434 486C456 504 482 508 504 504C534 498 560 488 576 470C596 448 608 432 612 412C618 384 624 362 626 340C628 320 630 304 630 286Z"/>
      <path d="M430 396C392 344 358 304 338 260L278 308C306 358 352 416 418 464Z"/>
    </g>

    <!-- tail -->
    <path d="M416 378C378 326 344 286 324 242L264 290C292 340 338 398 404 446Z" fill="#2A3B18" opacity="0.94"/>
    <g clip-path="url(#fTail)">
      <path d="M416 378C378 326 344 286 324 242L264 290C292 340 338 398 404 446Z" fill="none" stroke="#1B2810" stroke-width="24" opacity="0.28"/>
      <path d="M340 216L410 320L332 400Z" fill="#FBF7EB" opacity="0.12"/>
      <g fill="none" stroke="#16210C" stroke-width="7" opacity="0.38" stroke-linecap="round">
        <path d="M398 394C366 344 340 308 318 266M382 410C350 360 324 324 300 282"/>
      </g>
    </g>

    <!-- legs -->
    <g fill="none" stroke="#6B4C31" stroke-width="13" stroke-linecap="round">
      <path d="M500 462L496 512M530 460L532 512"/>
    </g>
    <g fill="none" stroke="#6B4C31" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M478 518L496 511L514 518M514 518L532 511L550 518"/>
    </g>

    <!-- beak -->
    <path d="M610 272C636 279 658 288 676 297C656 306 632 314 608 316C614 304 615 286 610 272Z" fill="#8C6543" opacity="0.95"/>

    <!-- body: first wash -->
    <path d="M616 268C610 236 596 214 570 216C544 218 516 238 504 266C486 300 460 306 436 324C416 348 402 372 402 406C402 436 406 456 420 468C442 486 468 490 490 486C520 480 546 470 562 452C582 430 594 414 598 394C604 366 610 344 612 322C614 302 616 286 616 268Z" fill="#4B6630" opacity="0.92"/>

    <g clip-path="url(#fBody)">
      <!-- second pass over the back and flank -->
      <path d="M356 200C470 206 522 258 522 340C522 420 558 442 620 452L620 520L356 520Z" fill="#2E4219" opacity="0.42"/>
      <!-- third pass, deepest -->
      <path d="M380 232C452 246 486 292 484 350C482 404 458 448 424 480L370 490L356 300Z" fill="#243516" opacity="0.28"/>
      <!-- crown -->
      <path d="M616 268C610 236 596 214 570 216C544 218 516 238 504 266C528 258 560 252 588 258C602 261 611 264 616 268Z" fill="#2A3D18" opacity="0.5"/>
      <!-- pale plumage lifted back out, last -->
      <path d="M418 460C446 486 486 492 518 478C554 462 582 430 596 392C602 368 604 348 602 334C588 372 566 412 534 438C500 466 454 470 418 460Z" fill="#E7E8C2" opacity="0.66"/>
      <path d="M458 472C488 482 522 470 548 448C576 424 594 392 602 358C606 384 600 420 580 446C556 476 512 492 476 486Z" fill="#F4F3DA" opacity="0.42"/>
      <!-- pigment gathering at the wet edge -->
      <path d="M616 268C610 236 596 214 570 216C544 218 516 238 504 266C486 300 460 306 436 324C416 348 402 372 402 406C402 436 406 456 420 468C442 486 468 490 490 486C520 480 546 470 562 452C582 430 594 414 598 394C604 366 610 344 612 322C614 302 616 286 616 268Z" fill="none" stroke="#2A3D18" stroke-width="26" opacity="0.28"/>
    </g>

    <!-- folded wing -->
    <path d="M524 340C484 352 446 384 420 442C452 438 488 416 512 386C524 370 528 354 524 340Z" fill="#2A3B18" opacity="0.9"/>
    <g clip-path="url(#fWing)">
      <path d="M524 340C484 352 446 384 420 442C452 438 488 416 512 386C524 370 528 354 524 340Z" fill="none" stroke="#16210C" stroke-width="18" opacity="0.3"/>
      <path d="M510 354C476 374 446 404 428 440" fill="none" stroke="#131C0A" stroke-width="7" opacity="0.42" stroke-linecap="round"/>
    </g>

    <!-- eye with a field-guide eye-ring -->
    <circle cx="584" cy="278" r="19" fill="#EFEBCC" opacity="0.85"/>
    <circle cx="584" cy="278" r="11" fill="#2A2013"/>
    <circle cx="588.5" cy="273.5" r="3.6" fill="#F7F2E1"/>

    <!-- broken contour line -->
    <g fill="none" stroke="#4E3A26" stroke-width="8" opacity="0.62" stroke-linejoin="round" stroke-linecap="round">
      <path d="M616 268C610 236 596 214 570 216C544 218 516 238 504 266C486 300 460 306 436 324C416 348 402 372 402 406C402 436 406 456 420 468C442 486 468 490 490 486C520 480 546 470 562 452C582 430 594 414 598 394C604 366 610 344 612 322C614 302 616 286 616 268Z" stroke-dasharray="176 22 128 18 206 16 138"/>
      <path d="M416 378C378 326 344 286 324 242L264 290C292 340 338 398 404 446" stroke-dasharray="146 20 118 16 190"/>
      <path d="M610 272C636 279 658 288 676 297C656 306 632 314 608 316" stroke-dasharray="62 12 74"/>
      <path d="M524 340C484 352 446 384 420 442" stroke-dasharray="58 16 70" opacity="0.8"/>
    </g>
  </g>
  </g>
</svg>
